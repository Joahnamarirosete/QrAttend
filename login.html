<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR Attend System — Login</title>
    <style>
      :root{--bg:#f3fbf7;--card:#ffffff;--green:#16a34a;--muted:#6b7f7f}
      *{box-sizing:border-box}
      body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;color:#07323a}
      .wrap{width:360px}
      .card{background:var(--card);border-radius:16px;padding:28px;box-shadow:0 18px 40px rgba(4,20,12,0.08)}
      .logo{width:84px;height:84;border-radius:10px;background:linear-gradient(180deg,#ecfdf5,#bbf7d0);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
      .logo strong{color:var(--green);font-size:20px}
      h1{margin:6px 0 6px;text-align:center;color:var(--green)}
      p.subtitle{text-align:center;color:var(--muted);margin:6px 0 16px}
      .role-badge{display:inline-block;background:#ecfdf5;color:#047857;padding:4px 8px;border-radius:6px;font-size:0.85rem;margin-bottom:12px}
      .tabs{display:flex;gap:8px;background:#f6fffb;padding:6px;border-radius:12px;margin:12px 0}
      .tab{flex:1;padding:10px;border-radius:10px;text-align:center;cursor:pointer;color:#1f5a4a}
      .tab.active{background:white;box-shadow:0 6px 18px rgba(2,6,23,0.05);font-weight:700}
      .note{background:#ecfdf5;border:1px solid #d1fae5;color:#065f46;padding:12px;border-radius:10px;margin:12px 0;font-size:0.95rem}
      label{display:block;font-weight:600;margin-top:10px;color:#0f3b36}
      input{width:100%;padding:12px;border-radius:12px;border:1px solid #eef7f4;background:#fbfffe;margin-top:6px}
      .primary{display:block;width:100%;padding:8px 10px;margin-top:14px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--green),#10b981);color:white;font-weight:700;cursor:pointer;font-size:0.9rem}
      /* One-inch fixed width utility */
      .one-inch { width:1in; min-width:1in; max-width:1in; display:inline-block; text-align:center; }
      .links{display:flex;justify-content:space-between;margin-top:12px;font-size:0.9rem}
      .links a{color:var(--green);text-decoration:none}
      footer{margin-top:14px;text-align:center;color:var(--muted);font-size:0.9rem}
      @media(max-width:420px){.wrap{width:92%}}
      /* Global compact buttons override */
      button, .btn, .primary, .btn-proceed, .logout, .btn-save, input[type="button"], input[type="submit"] {
        padding:6px 8px !important;
        font-size:0.85rem !important;
        border-radius:6px !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="logo"><strong>Qr</strong></div>
        <h1>QR Attend System</h1>
        <p class="subtitle">Fast and accurate attendance tracking</p>

        <div id="roleInfo" style="display:none">
          <span class="role-badge" id="roleBadge"></span>
        </div>

        <div class="tabs">
          <div class="tab active">Login</div>
          <div class="tab" onclick="location.href='signup.html?role=' + getRole()">Sign Up</div>
        </div>

        <div id="noteBox" class="note"></div>

        <form id="loginForm">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="studentID@student.school (e.g. m01@student.school)" required />
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Student ID (e.g. M01)" required />
          <button class="primary one-inch" type="submit" style="margin:12px auto;display:block">Login</button>
        </form>

        <div class="links">
          <a href="role.html">← Change Role</a>
          <a href="index.html">Home</a>
        </div>
        <footer>QrAttend • Demo</footer>
      </div>
    </div>

      function initializeRole() {
        const role = getRole();
        if (role) {
          document.getElementById('roleInfo').style.display = 'block';
          document.getElementById('roleBadge').textContent = role.charAt(0).toUpperCase() + role.slice(1);

          // Customize note based on role
          const noteBox = document.getElementById('noteBox');
          if (role === 'student') {
            noteBox.textContent = 'For Students: Use your email (format: m01@student.school for M01) and password (your Student ID like M01) to log in.';
          } else if (role === 'teacher') {
            noteBox.textContent = 'For Teachers: Use your registered email and password to log in.';
          }
        }
      }

      initializeRole();

      function createStudentSession(student) {
        // Create student portal data with actual subjects and attendance
        const studentData = {
          name: student.name,
          email: student.email,
          id: student.id,
          section: student.section,
          gender: student.gender,
          totalClasses: 0,
          attendanceRate: 0,
          subjects: [
            { name: 'Practical Research 2', code: 'PR2', present: 0, absent: 0, streak: 0 },
            { name: 'Understanding Culture, Society, and Politics', code: 'UCSP', present: 0, absent: 0, streak: 0 },
            { name: 'Personal Development', code: 'PD', present: 0, absent: 0, streak: 0 },
            { name: 'Physical Education and Health', code: 'PE', present: 0, absent: 0, streak: 0 },
            { name: 'General Chemistry', code: 'CHEM', present: 0, absent: 0, streak: 0 },
            { name: 'General Physics', code: 'PHY', present: 0, absent: 0, streak: 0 },
            { name: 'Introduction to the Philosophy of the Human Person', code: 'PHILO', present: 0, absent: 0, streak: 0 },
            { name: 'English for Academic and Professional Purposes', code: 'EAPP', present: 0, absent: 0, streak: 0 }
          ]
        };
        sessionStorage.setItem('studentData', JSON.stringify(studentData));
      }

      document.getElementById('loginForm').addEventListener('submit', function(e){
        e.preventDefault();
        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value.trim();
        const role = getRole();

        if (role === 'student') {
          // Find matching student (use studentsData)
          // normalize email and allow case-insensitive match for IDs/password
          const student = (studentsData || []).find(s => (s.email || '').toLowerCase() === email && (s.password || '').toString().toLowerCase() === password.toString().toLowerCase());
          if (!student) {
            alert('No matching student account found. Make sure you entered the correct email and Student ID as password.');
            return;
          }
          // create session data and go to portal
          createStudentSession(student);
          sessionStorage.setItem('studentEmail', student.email);
          sessionStorage.setItem('studentRole', 'student');
          location.href = 'studentPortal.html';
        } else if (role === 'teacher') {
          // Teacher login: check against localStorage qr_teachers
          try {
            const teachers = JSON.parse(localStorage.getItem('qr_teachers') || '[]');
            const teacher = teachers.find(t => t.email === email && t.password === password);
            if (!teacher) {
              alert('No matching teacher account found. Please check your email and password.');
              return;
            }
            // Store teacher session and redirect to teacherPortal
            sessionStorage.setItem('currentTeacher', JSON.stringify(teacher));
            sessionStorage.setItem('teacherRole', 'teacher');
            location.href = 'teacherPortal.html';
          } catch (err) {
            alert('Error logging in. Please try again.');
            console.error(err);
          }
        } else {
          alert('Unknown role. Please go back and select a role.');
        }
      });

</html>
