<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to QRAttend</title>
    <style>
      :root{--bg:#f8fbf9;--green:#16a34a;--teal:#0d9488;--text:#0f3b36;--muted:#6b7f7f}
      *{box-sizing:border-box}
      body{margin:0;font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh}
      .card{background:white;border-radius:24px;padding:54px 40px;box-shadow:0 20px 50px rgba(15,59,54,0.1);width:540px;text-align:center}
      .checkmark{width:64px;height:64;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
      .checkmark svg{width:40px;height:40;stroke:white;fill:none;stroke-width:3}
      h1{margin:0 0 24px;font-size:2.2rem;color:var(--text)}
      .highlight{color:var(--teal)}
      p.subtitle{margin:24px 0 36px;font-size:1.1rem;color:var(--teal);font-weight:600}
      .btn{display:inline-block;padding:14px 38px;border-radius:28px;border:none;background:linear-gradient(90deg,var(--green),var(--teal));color:white;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;transition:transform 0.2s}
      .btn:hover{transform:scale(1.02)}
      p.tagline{margin:32px 0 0;color:var(--muted);font-size:0.95rem}
      @media (max-width:600px){.card{width:92%;padding:36px 24px}h1{font-size:1.8rem}}
    </style>
  </head>
  <body>
    <div class="card">
      <div class="checkmark">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h1>Welcome to <span class="highlight">QRAttend</span></h1>
      <p class="subtitle">Select your user role and get started!</p>
      <button class="btn" onclick="location.href='role.html'">GET STARTED</button>
      <p class="tagline">Built for reliable digital check-ins.</p>
    </div>

    <script>
      // Keyboard shortcut: press 's' to get started
      document.addEventListener('keydown', (e) => {
        if (e.key === 's' || e.key === 'S') location.href = 'login.html';
      });
    </script>
  </body>
</html>
